name: Release

# Al subir una etiqueta vX.Y.Z se compila, se prueba y se publica un release con el zip de Chrome.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: La etiqueta debe coincidir con la versión de package.json
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con package.json ($v)"; exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run zip
      - name: Checksums
        working-directory: .output
        run: sha256sum ./*-chrome.zip > SHA256SUMS
      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" .output/*-chrome.zip .output/SHA256SUMS --generate-notes --title "$GITHUB_REF_NAME"
